<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Frame Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Primary Electric Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Secondary Neon Cyan Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- High-Contrast Lens Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="faviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container App Icon / Favicon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Outer Scanning Lens Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="240 60 120 40" stroke-linecap="round" opacity="0.85" filter="url(#faviconGlow)"/>

  <!-- Outer Tech Reticle Marks (4 Corners) -->
  <line x1="256" y1="36" x2="256" y2="56" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="476" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="476" x2="256" y2="456" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="56" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>

  <!-- Inner Dark Lens Ring -->
  <circle cx="256" cy="256" r="148" fill="url(#ringGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Loop Aspect: Infinity Aperture Blades -->
  <!-- Left Loop Wing -->
  <path d="M 256,256 C 160,130 80,220 160,310 C 210,350 256,256 256,256 Z" fill="url(#primaryGrad)" opacity="0.9"/>
  <!-- Right Loop Wing -->
  <path d="M 256,256 C 352,382 432,292 352,202 C 302,162 256,256 256,256 Z" fill="url(#glowGrad)" opacity="0.9"/>

  <!-- Intersecting Overlays for Depth -->
  <path d="M 256,256 C 130,352 220,432 310,352 C 350,302 256,256 256,256 Z" fill="url(#primaryGrad)" opacity="0.35"/>
  <path d="M 256,256 C 382,160 292,80 202,160 C 162,210 256,256 256,256 Z" fill="url(#glowGrad)" opacity="0.35"/>

  <!-- Lens Aperture Center Circle -->
  <circle cx="256" cy="256" r="64" fill="#0b0f19" stroke="url(#primaryGrad)" stroke-width="8"/>

  <!-- Focusing Glowing Core Dot -->
  <circle cx="256" cy="256" r="28" fill="url(#glowGrad)" filter="url(#faviconGlow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Core Lens Crosshairs -->
  <line x1="210" y1="256" x2="230" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="282" y1="256" x2="302" y2="256" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="210" x2="256" y2="230" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="282" x2="256" y2="302" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
